known_issues:
- id: static-depth-mode-off-not-bootable
  affected_recipes:
  - fixed-3
  - fixed-5
  - fixed-9
  symptom: 'MBX_DEPTH_MODE=off with the full MBX_DEPTH_* block fails before /health; the container exits at CUDA-graph
    capture with ValueError: num_speculative_tokens_per_batch_size is required for dynamic speculative decoding
    (Lead matrix runs d-fixed-5 and d-fixed-3, 2026-11-12).'
  root_cause: disabling the myllmbox depth controller drops the image into vLLM's own dynamic-SD schedule, which
    requires num_speculative_tokens_per_batch_size.
  fix: 'static depth is emulated on the bootable dynamic path: MBX_DEPTH_MODE=dynamic, MBX_DEPTH_MIN=CEIL=K, MBX_DEPTH_CEIL=[1
    -> K], MBX_DEPTH_PROMOTE=101,101, MBX_DEPTH_DEMOTE=0,0. Applied to fixed-3/fixed-5/fixed-9 in recipes/.'
  evidence: draft-lab/verification/boot-failure-static-depth.log
  status: fixed in draft-lab recipes; boot re-verification pending (Lead phase B)
- id: min-bootable-spec-depth-4
  affected_recipes:
  - curve-k1
  - curve-k3
  - fixed-3
  - draftk10-spec3
  symptom: 'speculative depth < 4 never boots on v5.4 -- neither static (MBX_DEPTH_MODE=off), nor the pinned ladder,
    nor plain dynamic depth. It fails at CUDA-graph capture with ValueError: num_speculative_tokens_per_batch_size
    is required for dynamic speculative decoding (Lead phase-B runs b-curve-k3 and b-k10-curve-k3).'
  root_cause: vLLM's dynamic-SD schedule validates num_speculative_tokens_per_batch_size; the v5.4 image provides
    it only for depth >= 4.
  fix: 'none at config level: minimum bootable speculative depth is 4. The recipes remain as documentation of the
    unreachable curve points but are marked bootable:false (matrix.yaml) and enabled:false (bench-matrix.yaml).'
  evidence:
  - bench/results/b-curve-k3/server.log
  - bench/results/b-k10-curve-k3/server.log
  - draft-lab/verification/boot-failure-min-depth.log
  status: documented; depth 1/3 unreachable on v5.4
unavailable:
  MBX_DRAFT_HEAD2: 'two-stage vocab head: the image ships basis files only for Qwen3.8-Flash-Next-FP4-Local and
    hibrid48, not for AZ -- not used'
  tools/draft_scale.py: patches an older module path; v5.4 reads MBX_MTP_DRAFT_SCALE natively, so the recipe env
