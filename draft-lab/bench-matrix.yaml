# draft-lab drop-in matrix for bench/run_matrix.py (generated by gen_recipes.py)
#
#   python3 bench/run_matrix.py --matrix draft-lab/bench-matrix.yaml --dry-run
#   python3 bench/run_matrix.py --matrix draft-lab/bench-matrix.yaml            # all tiers
#   python3 bench/run_matrix.py --matrix draft-lab/bench-matrix.yaml --max-configs 6  # tier 1 only
#
# Every recipe already carries the full env/vllm section and exactly ONE speculative-config;
# bench/serve.py mounts the workspace root and the HF hub at their absolute host paths, so the
# draft folders in "model": resolve without extra mounts.
# Configs run in priority order (tier 1 -> 2 -> 3); the M0 reference is disabled (already measured).
defaults:
  results_dir: bench/results-draft-lab
  port: 8000
  boot_timeout_s: 1500
  per_config_timeout_s: 2400
  stop_server: true
  suite_profile: full
  suite:
    request_timeout: 300
    retries: 1
  env: {}
configs:
- name: dl-dynamic-ceiling-9
  recipe: draft-lab/recipes/dynamic-ceiling-9.yaml
  priority: 1
  tag: draft-lab tier-1
  notes: 'dynamic speculative depth with max depth (ceiling) 9 instead of 12; ladder unchanged. Lead priority (a).
    K=9 is the dynamic ceiling: at <=3 concurrent requests the depth can reach 9; the [4 -> 8, ...] ladder still
    lowers it under load.'
- name: dl-fixed-5
  recipe: draft-lab/recipes/fixed-5.yaml
  priority: 2
  tag: draft-lab tier-1
  notes: 'STATIC depth 5 emulated on the dynamic path: MIN=CEIL=5 ([1 -> 5]), PROMOTE=101,101 (never promote), DEMOTE=0,0
    (never demote). Lead priority (b). MBX_DEPTH_MODE=off is not bootable in v5.4 (ValueError at cudagraph capture);
    this is the pinned-ladder equivalent. Compare with curve-k5 (same K, dynamic).'
- name: dl-draftk10-spec6
  recipe: draft-lab/recipes/draftk10-spec6.yaml
  priority: 3
  tag: draft-lab tier-1
  notes: 'draft folder qwen38-az-draft-k10 (drafter top-k 10), K=6, dynamic depth. Lead priority (c) and the highest-value
    hypothesis: the MTP layer was trained at 10 experts, so the draft folder restores its native routing. Uses "model":
    draft folder in --speculative-config.'
- name: dl-self-head0
  recipe: draft-lab/recipes/self-head0.yaml
  priority: 4
  tag: draft-lab tier-1
  notes: 'MBX_DRAFT_HEAD=0: drafter scores with the full bf16 target head (no NVFP4 copy). Lead priority (d). Baseline
    has MBX_DRAFT_HEAD=1 (0.36 GB NVFP4 copy per rank). Tests whether the quantized drafter head costs acceptance.'
- name: dl-self-scale2
  recipe: draft-lab/recipes/self-scale2.yaml
  priority: 5
  tag: draft-lab tier-1
  notes: 'MBX_MTP_DRAFT_SCALE=2: drafter logits sharpened x2 before the accept test. Lead priority (e). Exact: the
    verifier still uses the target''s distribution, so output text should not change; acceptance and tok/s may rise.'
- name: dl-fixed-9
  recipe: draft-lab/recipes/fixed-9.yaml
  priority: 6
  tag: draft-lab tier-1
  notes: 'STATIC depth 9 emulated on the dynamic path: MIN=CEIL=9 ([1 -> 9]), PROMOTE=101,101, DEMOTE=0,0. Lead
    priority (f). Pinned-ladder equivalent of static K=9 (MBX_DEPTH_MODE=off does not boot in v5.4); pair with dynamic-ceiling-9
    for the same max depth, adaptive vs pinned.'
- name: dl-self-draftfp8
  recipe: draft-lab/recipes/self-draftfp8.yaml
  priority: 7
  tag: draft-lab tier-2
  notes: 'MBX_DRAFT_FP8=1: fp8 drafter linears (faster drafts, maybe lower acceptance). Lead priority (h). Throughput
    vs acceptance trade-off for the drafter body, not the head; baseline drafter linears are bf16.'
- name: dl-draftk10-spec9
  recipe: draft-lab/recipes/draftk10-spec9.yaml
  priority: 8
  tag: draft-lab tier-2
  notes: 'draft folder qwen38-az-draft-k10, K=9, dynamic depth. Lead priority: draft-k10 at the dynamic ceiling
    9 point.'
- name: dl-draftk5-spec6
  recipe: draft-lab/recipes/draftk5-spec6.yaml
  priority: 9
  tag: draft-lab tier-2
  notes: 'draft folder qwen38-az-draft-k5 (top-k 5 control), K=6, dynamic depth. Control: a draft folder identical
    to the target''s own routing (5 experts). It must behave like the self-draft at the same K; if it does not,
    the draft-folder plumbing is wrong.'
- name: dl-dynamic-ceiling-12-ref
  recipe: draft-lab/recipes/dynamic-ceiling-12-ref.yaml
  priority: 10
  tag: draft-lab tier-2
  notes: 'REFERENCE M0: self-draft K=12, dynamic depth, ladder ceiling, head NVFP4, scale 1. Already measured by
    bench-harness as the myllmbox reference (M0). CONTROL: do not re-run in the scan; use its numbers as the baseline
    for every acceptance delta. CONTROL/M0: already measured by bench-harness; leave disabled.'
  enabled: false
- name: dl-no-spec
  recipe: draft-lab/recipes/no-spec.yaml
  priority: 11
  tag: draft-lab tier-2
  notes: no speculative decoding at all (token-0 / MTP off point of the curve). Lead priority (j). Emits NO --speculative-config
    (a literal 0 is not a valid vLLM value); measures the no-draft floor.
- name: dl-draftk10-dynamic
  recipe: draft-lab/recipes/draftk10-dynamic.yaml
  priority: 12
  tag: draft-lab tier-2
  notes: 'draft folder qwen38-az-draft-k10 with dynamic depth at ceiling K=12. The Lead-requested draft-k10 + dynamic-depth
    variant: 10-expert MTP routing AND concurrency-adaptive depth. Compare with draftk10-spec6/spec9 and the M0
    ref.'
- name: dl-self-greedy
  recipe: draft-lab/recipes/self-greedy.yaml
  priority: 13
  tag: draft-lab tier-3
  notes: 'draft_sample_method=greedy (baseline is probabilistic). Lead tier-3 request: greedy vs probabilistic draft
    sampling (block verification unchanged). Community mitigation for the MTP degenerate-loop bug.'
  suite_profile: quick
- name: dl-self-rejection-standard
  recipe: draft-lab/recipes/self-rejection-standard.yaml
  priority: 14
  tag: draft-lab tier-3
  notes: 'rejection_sample_method=standard (baseline is block/joint verification). Lead tier-3 request: standard
    vs block verification; block is the repo default (+2.4pp acceptance with probabilistic draft sampling).'
  suite_profile: quick
- name: dl-fixed-3
  recipe: draft-lab/recipes/fixed-3.yaml
  priority: 15
  tag: draft-lab tier-3
  notes: 'STATIC depth 3 emulated on the dynamic path: MIN=CEIL=3 ([1 -> 3]), PROMOTE=101,101, DEMOTE=0,0  NOT BOOTABLE
    on v5.4: the minimum bootable speculative depth is 4.. Lead tier-3 request; old config.env default depth. Pinned-ladder
    equivalent of static K=3 (MBX_DEPTH_MODE=off does not boot in v5.4). The Lead''s phase-B matrix also has self-fixed3
    / draftk10-fixed3 built with the same depth-law. DO NOT RUN on v5.4: depth < 4 fails at CUDA-graph capture (known
    issue min-bootable-spec-depth-4). NOT BOOTABLE on v5.4 (min speculative depth 4); disabled.'
  suite_profile: quick
  enabled: false
- name: dl-ceil-aggressive
  recipe: draft-lab/recipes/ceil-aggressive.yaml
  priority: 16
  tag: draft-lab tier-3
  notes: 'K=12, ceiling held high longer: [8 -> 8, 16 -> 6]. Keep depth 9-12 up to 7 concurrent requests, 8 at 8-15,
    6 at 16+. Exploratory: the tail latency at high concurrency decides whether this is worth it.'
  suite_profile: quick
- name: dl-ceil-flat9
  recipe: draft-lab/recipes/ceil-flat9.yaml
  priority: 17
  tag: draft-lab tier-3
  notes: 'K=12 but MBX_DEPTH_CEIL=[1 -> 9]: hard cap depth at 9 for EVERY concurrency. MBX_DEPTH_CEIL syntax is
    ''concurrency-threshold -> max-depth''. The baseline ladder only caps under load; this cap is flat. Compare
    with dynamic-ceiling-9 (K=9).'
  suite_profile: quick
- name: dl-curve-k1
  recipe: draft-lab/recipes/curve-k1.yaml
  priority: 18
  tag: draft-lab tier-3
  notes: 'token curve point: K=1, dynamic depth, self-draft  NOT BOOTABLE on v5.4: the minimum bootable speculative
    depth is 4.. Token curve 0/1/3/4/5/6/9/12: K=1 with the depth ladder able to stay at 1. DO NOT RUN on v5.4:
    depth < 4 fails at CUDA-graph capture (known issue min-bootable-spec-depth-4). NOT BOOTABLE on v5.4 (min speculative
    depth 4); disabled.'
  suite_profile: quick
  enabled: false
- name: dl-curve-k3
  recipe: draft-lab/recipes/curve-k3.yaml
  priority: 19
  tag: draft-lab tier-3
  notes: 'token curve point: K=3, dynamic depth, self-draft  NOT BOOTABLE on v5.4: the minimum bootable speculative
    depth is 4.. Token curve point (dynamic, ceiling 3). DO NOT RUN on v5.4: depth < 4 fails at CUDA-graph capture
    (known issue min-bootable-spec-depth-4). NOT BOOTABLE on v5.4 (min speculative depth 4); disabled.'
  suite_profile: quick
  enabled: false
- name: dl-curve-k4
  recipe: draft-lab/recipes/curve-k4.yaml
  priority: 20
  tag: draft-lab tier-3
  notes: 'token curve point: K=4, dynamic depth, self-draft. Token curve point (dynamic, ceiling 4); block-size
    3456 is divisible by 16/64 so no padding problem.'
  suite_profile: quick
- name: dl-curve-k5
  recipe: draft-lab/recipes/curve-k5.yaml
  priority: 21
  tag: draft-lab tier-3
  notes: 'token curve point: K=5, dynamic depth, self-draft. Same K as fixed-5 but with the dynamic depth ladder
    active.'
  suite_profile: quick
- name: dl-curve-k6
  recipe: draft-lab/recipes/curve-k6.yaml
  priority: 22
  tag: draft-lab tier-3
  notes: 'token curve point: K=6, dynamic depth, self-draft. Token curve point (dynamic, ceiling 6); anchor for
    the draftk10-spec6 comparison.'
  suite_profile: quick
- name: dl-draftk10-greedy
  recipe: draft-lab/recipes/draftk10-greedy.yaml
  priority: 23
  tag: draft-lab tier-3
  notes: draft-k10 with draft_sample_method=greedy. Greedy sampling applied to the 10-expert drafter (loop mitigation
    check).
  suite_profile: quick
- name: dl-draftk10-head0
  recipe: draft-lab/recipes/draftk10-head0.yaml
  priority: 24
  tag: draft-lab tier-3
  notes: 'draft-k10 with MBX_DRAFT_HEAD=0 (bf16 drafter head). Interaction of the two highest-value axes: 10-expert
    routing + unquantized head.'
  suite_profile: quick
- name: dl-draftk10-spec3
  recipe: draft-lab/recipes/draftk10-spec3.yaml
  priority: 25
  tag: draft-lab tier-3
  notes: 'draft-k10 at low depth K=3  NOT BOOTABLE on v5.4: the minimum bootable speculative depth is 4.. Low-depth
    point of the draft-k10 curve; cheap compute, check whether 10-expert routing still buys acceptance. DO NOT RUN
    on v5.4: depth < 4 fails at CUDA-graph capture (known issue min-bootable-spec-depth-4). NOT BOOTABLE on v5.4
    (min speculative depth 4); disabled.'
  suite_profile: quick
  enabled: false
- name: dl-draftk5-spec9
  recipe: draft-lab/recipes/draftk5-spec9.yaml
  priority: 26
  tag: draft-lab tier-3
  notes: draft-k5 control at K=9. Control at the dynamic-ceiling-9 point; should match dynamic-ceiling-9.
  suite_profile: quick
- name: dl-self-scale3
  recipe: draft-lab/recipes/self-scale3.yaml
  priority: 27
  tag: draft-lab tier-3
  notes: 'MBX_MTP_DRAFT_SCALE=3 (scale ladder: 1 baseline / 2 tier-1 / 3 here). Completes the scale 1/2/3 axis;
    scale 2 is tier-1. Sharpening too much can hurt when the drafter is confident but wrong, so this is exploratory.'
  suite_profile: quick
- name: dl-warmdrafter
  recipe: draft-lab/recipes/warmdrafter.yaml
  priority: 28
  tag: draft-lab tier-3
  notes: MBX_B12X_WARM_DRAFTER=1 (warm the drafter during model load). Low priority (Lead). Value semantics are
    not documented in the image; check the boot log for a drafter-warmup line. Does not change acceptance, only
    time-to-first-token/boot behaviour.
  suite_profile: quick
