# ══════════════════════════════════════════════════════════════════════════
# matrix-tests — the open questions from the 2026-11-21 baseline, as a run
# ══════════════════════════════════════════════════════════════════════════
# Not the baseline: this file answers the open tests in README.md plus the
# sub-agent and beyond-524k questions, with the minimum GPU time. Quality is
# off everywhere — capability equivalence is already established for every
# variant; only speed/latency/capacity are in question. Run:
#
#   python3 bench/run_matrix.py --matrix bench/matrix-tests.yaml
#   python3 bench/run_matrix.py --matrix bench/matrix-tests.yaml --only uncensored-standard
#
# and read the answers:
#   abba-1/abba-2 vs uncensored-standard  -> is the C=8 gap real or run order?
#   524k-pmu32    vs az-524k-single       -> is the TTFT penalty the prefix unit?
#   524k-dual     C=1 vs C=2              -> cost of the second long seat
#   524k-fp8kv    boot log + decode       -> pool ~1.5M? decode delta at K=16?
#   524k-batched64k  520k needle prefill  -> chunking or bandwidth ceiling?
#   standard-seats8  C=4/C=8 vs shipped   -> 8 seats x 94k: the sub-agent shape?
#   786k-single      780k needle          -> does YaRN 3.0 recall? boots at all?
#   256k-tri/quad/quad-fp8  boot + needle -> the sub-agent fleet at native 256k
#
# Compare against BASELINE.md (same harness, same box, same day).
# ══════════════════════════════════════════════════════════════════════════

defaults:
  results_dir: bench/results/tests-20261121
  suite_profile: quick
  suite:
    quality: "off"
  stop_server: true
  per_config_timeout_s: 2400

configs:
  # ── open test #1: the uncensored C=8 gap, order-swapped ──────────────────
  # az-standard runs first AND last: if uncensored is slow only in the middle
  # slot, it is thermal/host drift, not the unfused indexer.
  - name: abba-1
    recipe: recipes/az-standard.yaml
    suite_profile: quick
    suite:
      concurrency: [1, 8]
      long_smoke: false

  - name: uncensored-standard
    recipe: recipes/uncensored-standard.yaml
    suite_profile: quick
    suite:
      concurrency: [1, 8]
      long_smoke: false

  - name: abba-2
    recipe: recipes/az-standard.yaml
    suite_profile: quick
    suite:
      concurrency: [1, 8]
      long_smoke: false

  # ── open test #2: 524k TTFT attribution ──────────────────────────────────
  # One variable: prefix-match-unit 64 -> 32 (legal at 3520). Compare TTFT
  # p50 at C=1 against az-524k-single in BASELINE.md (266/287 ms).
  - name: 524k-pmu32
    recipe: recipes/tests/524k-pmu32.yaml
    suite:
      concurrency: [1]
      long_smoke: false

  # ── open test #6: two long seats ─────────────────────────────────────────
  # C=1 is the shipped-config sanity number; C=2 is the answer: per-seat
  # decode and TTFT with two long sessions sharing the 767k pool.
  - name: 524k-dual
    recipe: recipes/tests/524k-dual.yaml
    suite:
      concurrency: [1, 2]
      long_smoke: false

  # ── open test #6b: fp8 KV on 524k ───────────────────────────────────────
  # The answer is in the boot log (GPU KV cache size) + the decode delta at
  # C=1 vs BASELINE.md's 55.6. Expect ~1.4-1.5M tokens, -8..-15 % decode.
  - name: 524k-fp8kv
    recipe: recipes/tests/524k-fp8kv.yaml
    suite:
      concurrency: [1]
      long_smoke: false

  # ── open test #7: 520k prefill ceiling ──────────────────────────────────
  # The only entry that runs the full needle: 520k prompt, compare
  # prefill_tok_s against 2,216 (az) / 2,318 (uncensored) in BASELINE.md.
  - name: 524k-batched64k
    recipe: recipes/tests/524k-batched64k.yaml
    suite:
      concurrency: [1]
      long_target_tokens: 520000

  # ── sub-agent fleet shape ────────────────────────────────────────────────
  # 8 seats x 93,866 KV tokens each vs the shipped 16 x 46,933: does no-eviction
  # per seat pay for itself at the concurrency a real fleet reaches (C=4, C=8)?
  - name: standard-seats8
    recipe: recipes/tests/standard-seats8.yaml
    suite:
      concurrency: [1, 4, 8]
      long_smoke: false

  # ── beyond 524k: YaRN 3.0 ───────────────────────────────────────────────
  # 786,432 tokens, 26 GB KV, one stream. The 780k needle at 45% depth is the
  # referee; a boot failure in the first minutes is also an answer. Expect
  # ~6 min to first token on the needle (780k at ~2,200 tok/s).
  - name: 786k-single
    recipe: recipes/tests/786k-single.yaml
    suite:
      concurrency: [1]
      long_target_tokens: 780000
      long_timeout: 1200

  # ── 256k fleet: fewer sub-agents, every seat at native full context ─────
  # 262,144 is the checkpoint's trained context: no YaRN here, so recall is
  # as good as it gets. The three entries are the same question at three KV
  # shapes; the boot log's "Maximum concurrency for 262,144 tokens per
  # request" line is the first answer (expect 3.3x / 4.07x / ~5.5x), the
  # 260k needle the second (fp8 recall check), C=N decode the third.
  # quad may OOM at profile time — that is the answer too (4 seats want fp8).
  - name: 256k-tri
    recipe: recipes/tests/256k-tri.yaml
    suite:
      concurrency: [1, 3]
      long_target_tokens: 260000

  - name: 256k-quad
    recipe: recipes/tests/256k-quad.yaml
    suite:
      concurrency: [1, 4]
      long_target_tokens: 260000

  - name: 256k-quad-fp8
    recipe: recipes/tests/256k-quad-fp8.yaml
    suite:
      concurrency: [1, 4]
      long_target_tokens: 260000


