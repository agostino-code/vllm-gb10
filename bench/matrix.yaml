# bench/matrix.yaml — the seven shipped configurations, ready to measure.
#
#   python3 bench/check_recipes.py bench/matrix.yaml            # static preflight, no GPU
#   python3 bench/run_matrix.py --matrix bench/matrix.yaml --dry-run
#   nohup python3 bench/run_matrix.py --matrix bench/matrix.yaml > bench/results/matrix.out 2>&1 &
#   python3 bench/aggregate.py --results-dir bench/results
#
# Runner contract:
#   * configs run STRICTLY sequentially, ordered by `priority` then name
#   * for each config: serve.py up (container "bench-<name>") -> suite.py ->
#     serve.py down; safety checks refuse to boot while another model server
#     is running or the port is serving
#   * results land in bench/results/<name>/: summary.json, meta.json,
#     requests.jsonl, metrics/, server.log, status.json
#   * resumable: configs whose status.json says "done" are skipped.
#     --force redoes, --only NAME / --start-at NAME slices.
#
# Per-config keys (all optional except name/recipe):
#   name, recipe, priority, image, port, chat_template, set (recipe overrides
#   as "<section>.<key>"), env, mounts, docker_args, extra_args, suite_profile
#   (quick|full), suite (per-config overrides), boot_timeout_s, tag, enabled, notes

defaults:
  results_dir: bench/results
  port: 8000
  boot_timeout_s: 1500          # generous: this checkpoint boots in ~6-9 min
  per_config_timeout_s: 2400    # boot + suite hard timeout per config
  stop_server: true
  suite_profile: full
  suite:
    request_timeout: 300
    retries: 1
  env: {}

configs:
  # ── the two AZ configurations ─────────────────────────────────────────────
  - name: az-standard
    recipe: recipes/az-standard.yaml
    priority: 10
    suite_profile: full
    notes: shipped myllmbox v5.4 recipe, K=12 dynamic depth — the measured best

  - name: az-524k-single
    recipe: recipes/az-524k-single.yaml
    priority: 20
    suite_profile: full
    suite:
      # One seat: the concurrency ladder is meaningless here. Decode + prefill +
      # the long-context needle at the real ceiling are what matter.
      concurrency: [1]
      include_16: false
      long_target_tokens: 520000   # 99.2% of the ceiling: room for the 32-token answer + builder variance
    notes: 524k context, single stream, K=16 with the ceiling pinned to one request

  # ── the two uncensored configurations ─────────────────────────────────────
  - name: uncensored-standard
    recipe: recipes/uncensored-standard.yaml
    priority: 30
    suite_profile: full
    notes: abliterated checkpoint on the shipped settings — compare against az-standard

  - name: uncensored-524k-single
    recipe: recipes/uncensored-524k-single.yaml
    priority: 40
    suite_profile: full
    suite:
      concurrency: [1]
      include_16: false
      long_target_tokens: 520000   # 99.2% of the ceiling: room for the 32-token answer + builder variance
    notes: abliterated checkpoint at 524k single stream

  # ── the three configs promoted from the 2026-11-21/22 candidate run ───────
  - name: az-786k-single
    recipe: recipes/az-786k-single.yaml
    priority: 50
    suite_profile: full
    suite:
      concurrency: [1]
      include_16: false
      long_smoke: true
      long_target_tokens: 780000   # 99.2% of the 786,432 ceiling
      long_timeout: 1200           # ~6 min to first token on a 780k prefill
    notes: MAX CONTEXT — YaRN 3.0, 786,432 tokens, 778k needle verified OK

  - name: az-standard-seats8
    recipe: recipes/az-standard-seats8.yaml
    priority: 60
    suite_profile: full
    notes: FLEET — 8 sub-agents x 93,866 KV each, 335 ms TTFT at C=8, no barrier

  - name: az-256k-fleet
    recipe: recipes/az-256k-fleet.yaml
    priority: 70
    suite_profile: full
    suite:
      concurrency: [1, 4]
      long_smoke: true
      long_target_tokens: 260000   # 256k native, recall verified
    notes: FLEET at full native 256k — 4-5 seats x 262,144, fp8 KV; KNOWN 2.6 s
      concurrent-admission barrier at C=N (see recipe header); fine at C<=2

  # ── how to run an experiment without adding a file ────────────────────────
  # The knobs live in the recipe, so a variant is an override, not a copy:
  #
  # - name: az-standard-k4
  #   recipe: recipes/az-standard.yaml
  #   priority: 50
  #   set:
  #     vllm.speculative-config: '{"method":"mtp","num_speculative_tokens":4,"rejection_sample_method":"block","draft_sample_method":"probabilistic"}'
  #
  # - name: az-standard-fp8kv
  #   recipe: recipes/az-standard.yaml
  #   priority: 60
  #   set:
  #     vllm.kv-cache-dtype: fp8
  #     vllm.speculative-config: '{"method":"mtp","num_speculative_tokens":7,"rejection_sample_method":"block","draft_sample_method":"probabilistic"}'
  #
  # - name: az-standard-notuned
  #   recipe: recipes/az-standard.yaml
  #   priority: 70
  #   env:
  #     MBX_DEPTH_MODE: static
  #     MBX_DRAFT_HEAD: "0"      # measured -19 % decode: keep this as a control only
